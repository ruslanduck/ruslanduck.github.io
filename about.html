<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About – Duck Agency</title>
  <!--
    Страница /about.html была удалена, но осталась в индексе Google.
    GitHub Pages не умеет отдавать 301 на стороне сервера, поэтому это
    стандартный для статики редирект-заглушка: canonical говорит поисковику,
    какая страница настоящая, meta refresh и JS уводят живого посетителя.
    Когда /about выпадет из индекса (проверить в Search Console), файл можно удалить.
  -->
  <link rel="canonical" href="https://duck-agency.com/#team">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=/#team">
  <link rel="icon" type="image/svg+xml" href="/assets/icon-flat-small.svg">
  <meta name="theme-color" content="#0D0D0D">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0D0D0D;
      color: #F2F2F2;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    a { color: #FFD600; }
  </style>
  <script>window.location.replace('/#team');</script>
</head>
<body>
  <p>Redirecting to <a href="/#team">duck-agency.com</a>…</p>
</body>
</html>
